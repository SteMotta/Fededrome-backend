services:
  nginx:
    image: nginx:alpine
    container_name: fededrome_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      fastapi:
        condition: service_healthy
    networks:
      - fededrome_network

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fededrome_api
    restart: always
    env_file: .env
    environment:
      - REDIS_URL=redis://fededrome_redis:6379/0
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fededrome_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: fededrome_redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - fededrome_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  nginx_logs:

networks:
  fededrome_network:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: "fd00:1::/80"